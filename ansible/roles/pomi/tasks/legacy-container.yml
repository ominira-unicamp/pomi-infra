---
- name: Inspecionar {{ pomi_legacy_container }}
  community.docker.docker_container_info:
    name: "{{ pomi_legacy_container }}"
  register: pomi_legacy_info

- name: Remover {{ pomi_legacy_container }} não gerenciado pelo Compose
  community.docker.docker_container:
    name: "{{ pomi_legacy_container }}"
    state: absent
    force_kill: true
  when:
    - pomi_legacy_info.exists
    - pomi_legacy_info.container.Config.Labels['com.docker.compose.project'] | default('') != 'pomi-test'
