---
- name: Inspecionar {{ exchange_legacy_container }}
  community.docker.docker_container_info:
    name: "{{ exchange_legacy_container }}"
  register: exchange_legacy_info

- name: Remover {{ exchange_legacy_container }} não gerenciado pelo Compose
  community.docker.docker_container:
    name: "{{ exchange_legacy_container }}"
    state: absent
    force_kill: true
  when:
    - exchange_legacy_info.exists
    - exchange_legacy_info.container.Config.Labels['com.docker.compose.project'] | default('') != 'pomi-exchange'
