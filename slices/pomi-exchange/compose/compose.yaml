name: pomi-exchange

services:
  api:
    image: ${EXCHANGE_IMAGE:-pomi-exchange-backend:latest}
    container_name: pomi-exchange-backend
    restart: unless-stopped
    env_file:
      - /opt/pomi/exchange/backend.env
    volumes:
      - /opt/pomi/data:/data
    networks:
      - edge

  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    container_name: pomi-otel-collector
    restart: unless-stopped
    pid: host
    command:
      - --config
      - /etc/otelcol-contrib/config.yaml
    env_file:
      - /opt/pomi/exchange/backend.env
    volumes:
      - /opt/pomi/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /:/hostfs:ro
      - /var/lib/docker:/hostfs/var/lib/docker:ro
    networks:
      - edge

networks:
  edge:
    external: true
    name: pomi-edge
