name: pomi-test

services:
  postgres:
    image: postgres:18-alpine
    container_name: pomi-postgres-test
    restart: unless-stopped
    command:
      - -c
      - max_connections=20
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
    env_file:
      - /opt/pomi/planner-test/postgres.env
    volumes:
      - /opt/pomi/postgres-data:/var/lib/postgresql
    mem_limit: 192m
    memswap_limit: 384m
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U pomi -d pomi
      interval: 5s
      timeout: 3s
      retries: 24
    networks:
      - internal

  keycloak-schema:
    image: postgres:18-alpine
    restart: "no"
    env_file:
      - /opt/pomi/planner-test/postgres.env
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - PGPASSWORD="$$POSTGRES_PASSWORD" psql --host postgres --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" --command "CREATE SCHEMA IF NOT EXISTS keycloak"
    networks:
      - internal

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13}
    container_name: pomi-keycloak-test
    restart: unless-stopped
    env_file:
      - /opt/pomi/planner-test/keycloak.env
    command:
      - start
    volumes:
      - /opt/pomi/keycloak-config:/opt/keycloak/config:ro
      - /opt/pomi/keycloak-theme/pomi:/opt/keycloak/themes/pomi:ro
    mem_limit: 640m
    memswap_limit: 1024m
    depends_on:
      keycloak-schema:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          response="$$(cat <&3)";
          status="$${response#*\"status\"}";
          [[ "$$status" =~ ^[[:space:]]*:[[:space:]]*\"UP\" ]]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - internal
      - edge

  keycloak-config:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13}
    restart: "no"
    env_file:
      - /opt/pomi/planner-test/keycloak.env
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: pomi
    entrypoint:
      - /bin/bash
      - /opt/keycloak/config/configure-keycloak.sh
    volumes:
      - /opt/pomi/keycloak-config:/opt/keycloak/config:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - internal

  db-migrate:
    profiles:
      - api
    image: ${POMI_MIGRATE_IMAGE:-pomi-migrate-test:latest}
    container_name: pomi-migrate-test
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - /opt/pomi/planner-test/data.env
    mem_limit: 128m
    memswap_limit: 256m
    networks:
      - internal

  data-api:
    profiles:
      - api
    image: ${POMI_DATA_IMAGE:-pomi-data-test:latest}
    container_name: pomi-data-api-test
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    env_file:
      - /opt/pomi/planner-test/data.env
    mem_limit: 192m
    memswap_limit: 384m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000/health").then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 36
    networks:
      - internal
      - edge

  app-api:
    profiles:
      - api
    image: ${POMI_APP_IMAGE:-pomi-app-test:latest}
    container_name: pomi-app-api-test
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      keycloak-config:
        condition: service_completed_successfully
    env_file:
      - /opt/pomi/planner-test/app.env
    mem_limit: 192m
    memswap_limit: 384m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3001/health").then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 36
    networks:
      - internal
      - edge

  injection:
    profiles:
      - api
    image: ${POMI_INJECTION_IMAGE:-pomi-injection-test:latest}
    container_name: pomi-injection-test
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    env_file:
      - /opt/pomi/planner-test/injection.env
    volumes:
      - /opt/pomi/injection-data:/usr/src/app/data
      - /opt/pomi/injection/injections.json:/opt/pomi/injection/injections.json:ro
    mem_limit: 512m
    memswap_limit: 1024m
    healthcheck:
      test:
        - CMD-SHELL
        - kill -0 1
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - internal

  notifier:
    profiles:
      - api
    image: ${POMI_NOTIFIER_IMAGE:-pomi-notifier-test:latest}
    container_name: pomi-notifier-test
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    env_file:
      - /opt/pomi/planner-test/notifier.env
    mem_limit: 192m
    memswap_limit: 384m
    healthcheck:
      test:
        - CMD-SHELL
        - kill -0 1
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - internal

networks:
  edge:
    external: true
    name: pomi-edge
  internal:
    external: true
    name: pomi-test-internal
